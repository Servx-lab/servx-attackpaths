# Copy this file to .github/workflows/servx-security-scan.yml in the repository
# being scanned. Also copy servx-semgrep.yml to .servx/servx-semgrep.yml.
#
# Before enabling, set these repository variables to full immutable digests:
#   SERVX_GITLEAKS_IMAGE_DIGEST=sha256:...
#   SERVX_SEMGREP_IMAGE_DIGEST=sha256:...
#   SERVX_TRIVY_IMAGE_DIGEST=sha256:...
# Never use a mutable image tag in this workflow.
name: ServX security scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: servx-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@${{ vars.SERVX_GITLEAKS_IMAGE_DIGEST }}
  SEMGREP_IMAGE: semgrep/semgrep@${{ vars.SERVX_SEMGREP_IMAGE_DIGEST }}
  TRIVY_IMAGE: aquasec/trivy@${{ vars.SERVX_TRIVY_IMAGE_DIGEST }}

jobs:
  scan:
    name: Evidence-backed repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify immutable tool images are configured
        shell: bash
        run: |
          set -euo pipefail
          for image in "$GITLEAKS_IMAGE" "$SEMGREP_IMAGE" "$TRIVY_IMAGE"; do
            if [[ ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Repository variables must contain a full sha256 image digest. Refusing mutable or blank image: $image" >&2
              exit 1
            fi
          done

      - name: Pull approved immutable images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          docker pull "$SEMGREP_IMAGE"
          docker pull "$TRIVY_IMAGE"

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/servx-security"
          docker run --network none --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/servx-security:/out" \
            "$GITLEAKS_IMAGE" detect --source /src --no-git --redact \
            --report-format sarif --report-path /out/gitleaks.sarif --exit-code 0

      - name: Run Semgrep with repository-owned rules
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/.servx/servx-semgrep.yml"
          set +e
          docker run --network none --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/servx-security:/out" \
            "$SEMGREP_IMAGE" semgrep scan --config /src/.servx/servx-semgrep.yml \
            --sarif --output /out/semgrep.sarif /src
          scan_status=$?
          set -e
          if [[ "$scan_status" -gt 1 ]]; then
            exit "$scan_status"
          fi

      - name: Warm Trivy vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/servx-trivy-cache"
          docker run --rm \
            -v "$RUNNER_TEMP/servx-trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --download-db-only --cache-dir /cache

      - name: Run Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --network none --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/servx-security:/out" \
            -v "$RUNNER_TEMP/servx-trivy-cache:/cache" \
            "$TRIVY_IMAGE" fs /src --cache-dir /cache --scanners vuln,misconfig,secret \
            --format sarif --output /out/trivy.sarif --exit-code 0

      - name: Upload SARIF to GitHub code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_sarif() {
            local file="$1"
            local tool_name="$2"
            test -s "$file" || return 0
            local encoded_file="$RUNNER_TEMP/servx-security/${tool_name}.sarif.base64"
            local payload_file="$RUNNER_TEMP/servx-security/${tool_name}.sarif.payload.json"
            gzip -9 < "$file" | base64 --wrap=0 > "$encoded_file"
            jq -n \
              --arg commit_sha "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF" \
              --arg tool_name "$tool_name" \
              --rawfile sarif "$encoded_file" \
              '{commit_sha: $commit_sha, ref: $ref, sarif: $sarif, tool_name: $tool_name}' > "$payload_file"
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
              --input "$payload_file" >/dev/null
          }

          upload_sarif "$RUNNER_TEMP/servx-security/gitleaks.sarif" 'gitleaks'
          upload_sarif "$RUNNER_TEMP/servx-security/semgrep.sarif" 'semgrep'
          upload_sarif "$RUNNER_TEMP/servx-security/trivy.sarif" 'trivy'
